<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'" />
  <title>ScamShield – Recording indicator</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; background: transparent; pointer-events: none; overflow: hidden; }

    .corners-container {
      position: absolute;
      top: 0;
      left: 0;
      pointer-events: none;
      display: none;
    }
    .corners-container.visible {
      display: block;
    }

    /*
     * L-shaped corner brackets: 20px wide, 40px tall.
     * Each corner is made of two arms (horizontal + vertical) forming an L.
     * Default colour: #808080 (grey). Turns green (#22c55e) for email.
     */
    .bracket {
      position: absolute;
      pointer-events: none;
    }
    .bracket.top-left { top: 0; left: 0; }
    .bracket.top-right { top: 0; right: 0; }
    .bracket.bottom-left { bottom: 0; left: 0; }
    .bracket.bottom-right { bottom: 0; right: 0; }

    .bracket .arm {
      position: absolute;
      background: var(--bracket-color, #808080);
      transition: background 0.15s ease;
    }

    /* Top-left: horizontal arm goes right, vertical arm goes down */
    .bracket.top-left .arm-h {
      top: 0; left: 0;
      width: 40px; height: 3px;
    }
    .bracket.top-left .arm-v {
      top: 0; left: 0;
      width: 3px; height: 40px;
    }

    /* Top-right: horizontal arm goes left, vertical arm goes down */
    .bracket.top-right .arm-h {
      top: 0; right: 0;
      width: 40px; height: 3px;
    }
    .bracket.top-right .arm-v {
      top: 0; right: 0;
      width: 3px; height: 40px;
    }

    /* Bottom-left: horizontal arm goes right, vertical arm goes up */
    .bracket.bottom-left .arm-h {
      bottom: 0; left: 0;
      width: 40px; height: 3px;
    }
    .bracket.bottom-left .arm-v {
      bottom: 0; left: 0;
      width: 3px; height: 40px;
    }

    /* Bottom-right: horizontal arm goes left, vertical arm goes up */
    .bracket.bottom-right .arm-h {
      bottom: 0; right: 0;
      width: 40px; height: 3px;
    }
    .bracket.bottom-right .arm-v {
      bottom: 0; right: 0;
      width: 3px; height: 40px;
    }

    /* Status indicator pill: top-right of active window, ~80x24px */
    .status-pill {
      position: absolute;
      top: 8px;
      right: 8px;
      min-width: 80px;
      height: 24px;
      padding: 0 10px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border-radius: 12px;
      font-size: 12px;
      font-weight: 600;
      color: #fff;
      white-space: nowrap;
      max-width: 180px;
      overflow: hidden;
      text-overflow: ellipsis;
      transition: background-color 0.45s ease;
      pointer-events: none;
      -webkit-font-smoothing: antialiased;
    }
    .status-pill.state-monitoring {
      background-color: #22c55e;
    }
    .status-pill.state-processing {
      background-color: #4a4a4a;
    }
    /* Debug log: last 3 actions, bottom-right; inline style on #debug-log sets base. */
    #debug-log {
      background: rgba(0, 0, 0, 0.5);
      padding: 6px 8px;
      border-radius: 4px;
      max-width: 280px;
      line-height: 1.4;
      white-space: pre-wrap;
      word-break: break-all;
    }
    /* System fonts: SF Pro (macOS), Segoe UI (Windows) */
    .status-pill {
      font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Segoe UI', Roboto, sans-serif;
    }
  </style>
</head>
<body>
  <div id="corners" class="corners-container" aria-hidden="true" role="presentation">
    <div id="status-pill" class="status-pill state-processing" aria-hidden="true">Monitoring</div>
    <div class="bracket top-left"><div class="arm arm-h"></div><div class="arm arm-v"></div></div>
    <div class="bracket top-right"><div class="arm arm-h"></div><div class="arm arm-v"></div></div>
    <div class="bracket bottom-left"><div class="arm arm-h"></div><div class="arm arm-v"></div></div>
    <div class="bracket bottom-right"><div class="arm arm-h"></div><div class="arm arm-v"></div></div>
  </div>
  <div id="debug-log" style="position:fixed; bottom:10px; right:10px; color:lime; font-family:monospace; font-size:10px; pointer-events:none;"></div>
  <script>
    (function () {
      var overlayAPI = window.overlayAPI;
      var container = document.getElementById('corners');
      var currentState = 'processing';
      var pendingBounds = null;
      var rafId = null;

      var GREY = '#808080';
      var GREEN = '#22c55e';
      var appName = '';
      var windowTitle = '';

      var debugActions = [];
      var DEBUG_MAX = 3;

      function addDebugAction(label) {
        debugActions.push(label);
        if (debugActions.length > DEBUG_MAX) debugActions.shift();
        var el = document.getElementById('debug-log');
        if (el) el.textContent = debugActions.join('\n');
      }

      function getColor() {
        return currentState === 'monitoring' ? GREEN : GREY;
      }

      function updateStatusPill() {
        var pill = document.getElementById('status-pill');
        if (!pill) return;
        pill.className = 'status-pill state-' + currentState;
        pill.textContent = currentState === 'monitoring' ? 'Email Detected' : (appName || 'Monitoring');
        pill.title = windowTitle || appName || '';
      }

      function renderFrame() {
        rafId = null;
        if (!container) return;
        var b = pendingBounds;
        if (!b || b.width < 200 || b.height < 200) {
          container.classList.remove('visible');
          return;
        }
        container.classList.add('visible');
        container.style.left = b.x + 'px';
        container.style.top = b.y + 'px';
        container.style.width = b.width + 'px';
        container.style.height = b.height + 'px';
        container.style.setProperty('--bracket-color', getColor());
        updateStatusPill();
      }

      function scheduleRender() {
        if (rafId != null) return;
        rafId = requestAnimationFrame(renderFrame);
      }

      function applyState(state) {
        currentState = state || 'processing';
        addDebugAction('State: ' + (state || 'processing'));
        scheduleRender();
      }

      function applyBounds(bounds) {
        pendingBounds = bounds;
        addDebugAction('Bounds: ' + (bounds ? bounds.width + 'x' + bounds.height : 'null'));
        scheduleRender();
      }

      if (overlayAPI) {
        if (overlayAPI.onRenderState) {
          overlayAPI.onRenderState(function (state) { applyState(state); });
        }
        if (overlayAPI.onState) {
          overlayAPI.onState(function (state) { applyState(state); });
        }
        if (overlayAPI.onBounds) {
          overlayAPI.onBounds(function (bounds) { applyBounds(bounds); });
        }
        if (overlayAPI.onWindowData) {
          overlayAPI.onWindowData(function (data) {
            applyState(data.state);
            applyBounds(data.bounds);
            if (data.appName != null) appName = data.appName;
            if (data.windowTitle != null) windowTitle = data.windowTitle;
            updateStatusPill();
          });
        }
        if (overlayAPI.onDebugLogEntry) {
          overlayAPI.onDebugLogEntry(function (line) { addDebugAction(line); });
        }
      }
    })();
  </script>
</body>
</html>
